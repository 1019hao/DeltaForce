<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角洲行动 · 接单后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg">
  <style>
    :root{
      --bg:#0b0f1a; --card:#111827; --line:#1f2937; --fg:#e5e7eb;
      --muted:#9ca3af; --acc:#22d3ee; --acc2:#a78bfa; --danger:#f87171; --ok:#4ade80;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;min-height:100dvh}
    .glass{background:rgba(17,24,39,.9);backdrop-filter:blur(12px);border:1px solid var(--line)}
    .btn{@apply px-4 py-2 rounded-lg font-medium transition}
    .btn-primary{@apply btn bg-cyan-500 hover:bg-cyan-400 text-black}
    .btn-ghost{@apply btn bg-transparent hover:bg-white/10 border border-white/10}
    .btn-danger{@apply btn bg-red-500/80 hover:bg-red-500 text-white}
    .input{@apply w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/40 focus:border-transparent}
    .card{@apply glass rounded-2xl p-6}
    .scrollbar-thin::-webkit-scrollbar{width:6px;height:6px}
    .scrollbar-thin::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .animate-in{animation:fadeIn .3s ease-out forwards}
    .mono{font-family:'JetBrains Mono',monospace}
  </style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
