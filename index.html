<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>三角洲行动 · 接单系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background-color:#050608;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px 50px;color:#fff;position:relative;overflow-x:hidden}
.bg-light{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-light::before{content:"";position:absolute;top:-10%;left:-10%;width:70vw;height:70vw;max-width:600px;max-height:600px;background:radial-gradient(circle,rgba(40,100,255,0.25) 0%,transparent 60%);border-radius:50%;animation:float 12s infinite alternate ease-in-out}
.bg-light::after{content:"";position:absolute;bottom:-10%;right:-10%;width:60vw;height:60vw;max-width:500px;max-height:500px;background:radial-gradient(circle,rgba(0,220,255,0.15) 0%,transparent 60%);border-radius:50%;animation:float 15s infinite alternate-reverse ease-in-out}
@keyframes float{0%{transform:translate(0,0)}100%{transform:translate(30px,40px)}}
.app-container{position:relative;z-index:10;width:100%;max-width:520px;display:flex;flex-direction:column;gap:20px}
.page{display:none;flex-direction:column;gap:20px;animation:fadeUp 0.4s ease}
.page.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.glass{position:relative;background:rgba(20,24,36,0.45);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-radius:32px;overflow:hidden;box-shadow:0 24px 48px -12px rgba(0,0,0,0.7),inset 0 1px 1px rgba(255,255,255,0.3),inset 0 -1px 1px rgba(0,0,0,0.5),inset 0 0 0 1px rgba(255,255,255,0.06)}
.glass::before{content:"";position:absolute;top:0;left:5%;right:5%;height:45%;background:radial-gradient(ellipse 100% 100% at 50% 0%,rgba(255,255,255,0.15) 0%,transparent 80%);pointer-events:none;border-radius:inherit}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,rgba(255,255,255,0.4) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.1) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glass-content{position:relative;z-index:2;padding:24px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;font-size:1rem;font-weight:600;color:#fff;cursor:pointer;border:none;border-radius:60px;background:linear-gradient(180deg,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0.03) 100%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 20px -8px rgba(0,0,0,0.6),inset 0 1px 1px rgba(255,255,255,0.4),inset 0 -1px 1px rgba(0,0,0,0.2);overflow:hidden;transition:all 0.25s ease;user-select:none}
.btn::before{content:"";position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);transform:skewX(-20deg);transition:left 0.6s ease}
.btn:hover::before{left:150%}
.btn:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(180deg,rgba(60,140,255,0.8) 0%,rgba(20,80,220,0.8) 100%);box-shadow:0 10px 24px -8px rgba(0,80,255,0.5),inset 0 1px 1px rgba(255,255,255,0.5),inset 0 -1px 1px rgba(0,0,0,0.3)}
.btn-danger{background:linear-gradient(180deg,rgba(255,60,60,0.8) 0%,rgba(200,20,20,0.8) 100%);box-shadow:0 10px 24px -8px rgba(255,0,0,0.5),inset 0 1px 1px rgba(255,255,255,0.5)}
.btn-small{padding:8px 14px;font-size:0.85rem;border-radius:30px}
input,select{width:100%;padding:14px 18px;font-size:0.95rem;color:#fff;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:16px;outline:none;box-shadow:inset 0 2px 5px rgba(0,0,0,0.4);transition:all 0.3s ease}
input::placeholder{color:rgba(255,255,255,0.3)}
input:focus,select:focus{border-color:rgba(60,140,255,0.5);background:rgba(0,0,0,0.5)}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;background-size:16px}
label{display:block;margin-bottom:6px;font-size:0.85rem;color:rgba(255,255,255,0.7);margin-left:4px}
.form-stack{display:flex;flex-direction:column;gap:12px}
.login-header{text-align:center;margin-bottom:30px}
.login-icon{font-size:3.5rem;margin-bottom:12px;filter:drop-shadow(0 0 20px rgba(60,140,255,0.6))}
.login-title{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#fff,#a0c4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hint{font-size:0.8rem;color:rgba(255,255,255,0.4);text-align:center;min-height:1.2em;margin-top:10px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:40px}
.user-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.username{font-weight:600;font-size:1.1rem}
.role-tag{padding:4px 10px;font-size:0.75rem;font-weight:600;background:rgba(60,140,255,0.3);border:1px solid rgba(60,140,255,0.5);border-radius:20px;color:#a0c4ff}
.db-status{font-size:0.7rem;padding:4px 8px;border-radius:12px;font-weight:normal}
.db-status.offline{background:rgba(255,60,60,0.2);border:1px solid rgba(255,60,60,0.5);color:#ff6b6b}
.db-status.online{background:rgba(0,200,100,0.2);border:1px solid rgba(0,200,100,0.5);color:#00ff88}
.card-title{font-size:1.1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.list-stack{display:flex;flex-direction:column;gap:12px}
.divider{height:1px;background:rgba(255,255,255,0.1);margin:16px 0}
.order-card{padding:16px;border-radius:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)}
.order-req{font-weight:500;margin-bottom:10px;line-height:1.4;font-size:0.95rem}
.amount-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.amount-badge{padding:4px 10px;font-size:0.8rem;font-weight:600;background:rgba(0,0,0,0.4);border-radius:8px;color:#66b3ff}
.order-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.status-text{font-size:0.8rem;color:rgba(255,255,255,0.5)}
.code-badge{display:inline-block;padding:6px 12px;font-family:monospace;font-size:1.1rem;letter-spacing:3px;background:rgba(0,200,255,0.15);border:1px solid rgba(0,200,255,0.4);border-radius:8px;color:#00d4ff;margin:8px 0}
.order-photo{width:100%;max-height:180px;object-fit:contain;border-radius:12px;margin:10px 0;border:1px solid rgba(255,255,255,0.1)}
.hidden{display:none!important}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);padding:12px 24px;background:rgba(30,40,50,0.9);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);border-radius:30px;font-size:0.9rem;font-weight:500;color:#fff;opacity:0;pointer-events:none;transition:all 0.3s cubic-bezier(0.2,0.9,0.3,1.2);z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="bg-light"></div>

<div class="app-container">
  <div id="loginPage" class="page active">
    <div class="glass">
      <div class="glass-content">
        <div class="login-header">
          <div class="login-icon">⚡</div>
          <h1 class="login-title">三角洲行动</h1>
        </div>
        <div class="form-stack">
          <div><label>账号</label><input type="text" id="loginUser" placeholder="请输入账号"></div>
          <div><label>密码</label><input type="password" id="loginPass" placeholder="请输入密码"></div>
          <!-- 直接使用内联 onclick 触发，绕过任何绑定失效问题 -->
          <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()" style="margin-top: 10px;">登 录</button>
          <p class="hint" id="loginHint"></p>
        </div>
      </div>
    </div>
  </div>

  <div id="mainPage" class="page">
    <div class="glass top-bar">
      <div class="user-info">
        <span id="navUser" class="username">-</span>
        <span id="navRole" class="role-tag">-</span>
        <span id="dbStatus" class="db-status offline">离线模式</span>
      </div>
      <button class="btn btn-small" onclick="handleLogout()">退出</button>
    </div>
    <div id="roleContent" class="list-stack"></div>
  </div>
</div>

<script>
window.onerror = function(msg) { console.warn("全局异常:", msg); return true; };

let sql = null;
let isDbReady = false;
let currentUser = null;
let offlineOrders = []; 
const ROLE_LABEL = { superadmin: '超管', admin: '管理员', support: '客服', player: '打手' };
const $ = (id) => document.getElementById(id);

// 纯原生 fetch 请求 Neon（绕过所有库的兼容问题）
async function execSQL(query, params = []) {
  const url = 'https://ep-purple-tree-aoxl1seu-pooler.c-2.ap-southeast-1.aws.neon.tech/sql';
  const dbStr = 'postgresql://neondb_owner:npg_0nlYJaLt2Zmy@ep-purple-tree-aoxl1seu-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Neon-Connection-String': dbStr },
    body: JSON.stringify({ query, params })
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(text || '数据库请求失败');
  }
  const data = await res.json();
  return data.rows || [];
}

async function initDB() {
  if (isDbReady) return true;
  try {
    await execSQL('CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY, username TEXT UNIQUE NOT NULL, password_hash TEXT NOT NULL, role TEXT NOT NULL)');
    await execSQL('CREATE TABLE IF NOT EXISTS orders (id SERIAL PRIMARY KEY, customer_req TEXT NOT NULL, amount_client NUMERIC NOT NULL, amount_player NUMERIC NOT NULL, photo_url TEXT, random_code TEXT, status TEXT NOT NULL DEFAULT \'pending\', player_id INTEGER REFERENCES users(id))');
    
    const hash = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
    const existing = await execSQL('SELECT id FROM users WHERE username = $1 LIMIT 1', ['admin']);
    if (existing.length === 0) {
      await execSQL('INSERT INTO users (username, password_hash, role) VALUES ($1, $2, $3)', ['admin', hash, 'superadmin']);
    }
    
    isDbReady = true;
    updateDbStatus(true);
    return true;
  } catch (e) {
    console.warn("数据库连接失败(已降级离线):", e);
    isDbReady = false;
    updateDbStatus(false);
    return false;
  }
}

function updateDbStatus(online) {
  const el = $('dbStatus');
  if (!el) return;
  if (online) {
    el.textContent = '云端已连接';
    el.className = 'db-status online';
  } else {
    el.textContent = '本地离线模式';
    el.className = 'db-status offline';
  }
}

function showToast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; void el.offsetWidth; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

// 纯 JS 实现的 SHA-256，彻底解决本地无法使用 crypto 的问题
function sha256(ascii) {
    function rightRotate(value, amount) { return (value>>>amount) | (value<<(32-amount)); };
    var mathPow = Math.pow; var maxWord = mathPow(2, 32); var lengthProperty = 'length'; var i, j; var result = '';
    var words = []; var asciiBitLength = ascii[lengthProperty]*8;
    var hash = sha256.h = sha256.h || []; var k = sha256.k = sha256.k || []; var primeCounter = k[lengthProperty];
    var isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
            for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
            hash[primeCounter] = (mathPow(candidate, .5)*maxWord)|0; k[primeCounter++] = (mathPow(candidate, 1/3)*maxWord)|0;
        }
    }
    ascii += '\x80'; while (ascii[lengthProperty]%64 - 56) ascii += '\x00';
    for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i); if (j>>8) return; words[i>>2] |= j << ((3 - i)%4)*8;
    }
    words[words[lengthProperty]] = ((asciiBitLength/maxWord)|0); words[words[lengthProperty]] = (asciiBitLength)
    for (j = 0; j < words[lengthProperty];) {
        var w = words.slice(j, j += 16); var oldHash = hash; hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
            var w15 = w[i - 15], w2 = w[i - 2]; var a = hash[0], e = hash[4];
            var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e&hash[5])^((~e)&hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15>>>3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2>>>10)))|0);
            var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
            hash = [(temp1 + temp2)|0].concat(hash); hash[4] = (hash[4] + temp1)|0;
        }
        for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i])|0; }
    }
    for (i = 0; i < 8; i++) { for (j = 3; j + 1; j--) { var b = (hash[i]>>(j*8))&255; result += ((b < 16) ? 0 : '') + b.toString(16); } }
    return result;
};

function generateCode() { const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let s = ''; for (let i = 0; i < 10; i++) s += chars[Math.floor(Math.random() * chars.length)]; return s; }

async function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('请选择图片文件'));
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        const max = 800;
        if (w > max || h > max) { if (w > h) { h = h / w * max; w = max; } else { w = w / h * max; h = max; } }
        canvas.width = w; canvas.height = h; 
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
        let q = 0.8; let data = canvas.toDataURL('image/jpeg', q);
        while (data.length > 120 * 1024 && q > 0.1) { q -= 0.1; data = canvas.toDataURL('image/jpeg', q); }
        resolve(data);
      };
      img.onerror = () => reject(new Error('图片解析失败'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}

function renderUI() {
  $('loginPage').classList.remove('active');
  $('mainPage').classList.add('active');
  $('navUser').textContent = currentUser.username;
  $('navRole').textContent = ROLE_LABEL[currentUser.role] || currentUser.role;
  renderContent();
}

async function renderContent() {
  const container = $('roleContent'); container.innerHTML = '';
  const role = currentUser.role;
  const isAdmin = role === 'superadmin' || role === 'admin';
  const canTake = role === 'player' || role === 'support' || isAdmin;

  if (canTake) {
    container.insertAdjacentHTML('beforeend', `<div class="glass"><div class="glass-content"><div class="card-title">🎯 接单大厅</div><div id="hallList" class="list-stack"></div></div></div>`);
    await loadHall();
  }

  if (isAdmin) {
    container.insertAdjacentHTML('beforeend', `
      <div class="glass"><div class="glass-content">
        <div class="card-title">⚙️ 管理员面板</div>
        <div class="form-stack" style="margin-bottom: 20px;">
          <input type="text" id="disReq" placeholder="客户要求"><input type="number" id="disAc" placeholder="客户付款金额"><input type="number" id="disAp" placeholder="打手可得金额">
          <button class="btn btn-primary" onclick="handleDispatch()">派 单</button>
        </div>
        <div class="divider"></div>
        <div class="card-title">👤 添加新账号</div>
        <div class="form-stack">
          <input type="text" id="newUser" placeholder="新账号名"><input type="password" id="newPass" placeholder="新账号密码">
          <select id="newRole"><option value="player">打手</option><option value="support">客服</option><option value="admin">管理员</option></select>
          <button class="btn btn-primary" onclick="handleAddUser()">添加账号</button>
        </div>
        <div class="divider"></div>
        <button class="btn btn-small" onclick="loadReviewOrders()" style="width: 100%; margin-bottom: 10px;">🔍 待审核订单</button>
        <div id="reviewList" class="list-stack" style="margin-bottom: 10px;"></div>
        <button class="btn btn-small" onclick="loadAllOrders()" style="width: 100%; margin-bottom: 10px;">📋 所有订单记录</button>
        <div id="allList" class="list-stack"></div>
      </div></div>
    `);
  }

  if (role === 'player') {
    container.insertAdjacentHTML('beforeend', `<div class="glass"><div class="glass-content"><div class="card-title">📦 我的接单</div><div id="myList" class="list-stack"></div></div></div>`);
    await loadMine();
  }

  if (currentUser.username !== 'admin') {
    container.insertAdjacentHTML('beforeend', `
      <div class="glass"><div class="glass-content">
        <div class="card-title">🔐 用户中心</div>
        <div class="form-stack">
          <input type="password" id="changePassInput" placeholder="输入新密码（至少3位）">
          <button class="btn btn-small" onclick="handleChangePass()">修改密码</button>
        </div>
      </div></div>
    `);
  }
}

async function loadHall() {
  const list = $('hallList'); if (!list) return;
  list.innerHTML = '<p style="text-align:center;color:#888;font-size:0.85rem;">加载中...</p>';
  if (!isDbReady) {
    const rows = offlineOrders.filter(o => o.status === 'pending' || (o.status === 'assigned' && o.player_id === currentUser.id));
    return renderHallUI(rows, list);
  }
  try {
    const rows = await execSQL('SELECT id, customer_req, amount_client, amount_player, status, player_id FROM orders WHERE status = \'pending\' OR (status = \'assigned\' AND player_id = $1) ORDER BY id DESC', [currentUser.id]);
    renderHallUI(rows, list);
  } catch (e) { list.innerHTML = '<p style="text-align:center;color:#ff6b6b;font-size:0.85rem;">获取失败</p>'; }
}

function renderHallUI(rows, list) {
  if (rows.length === 0) { list.innerHTML = '<p style="text-align:center;color:#888;font-size:0.85rem;padding:10px;">暂无订单</p>'; return; }
  list.innerHTML = rows.map(o => {
    const isPending = o.status === 'pending';
    const isMine = o.status === 'assigned' && o.player_id === currentUser.id;
    return `
      <div class="order-card">
        <div class="order-req">${escapeHtml(o.customer_req)}</div>
        <div class="amount-row"><span class="amount-badge">客户 ¥${o.amount_client}</span><span class="amount-badge">打手 ¥${o.amount_player}</span></div>
        <div class="order-actions">
          <span class="status-text">状态: ${o.status}</span>
          <div style="display:flex; gap:8px;">
            ${isPending ? `<button class="btn btn-small take-btn" onclick="takeOrder('${o.id}')">接单</button>` : ''}
            ${isMine ? `<button class="btn btn-small up-btn" onclick="uploadImage('${o.id}')">上传图片</button>` : ''}
            ${(isPending && currentUser.role !== 'player') || isMine ? `<button class="btn btn-small btn-danger cancel-btn" onclick="cancelOrder('${o.id}', '${isMine}')">取消</button>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

window.takeOrder = async function(id) {
  if (!isDbReady) {
    const order = offlineOrders.find(o => o.id == id);
    if (order) { order.status = 'assigned'; order.player_id = currentUser.id; showToast('接单成功(离线)'); }
    return loadHall();
  }
  try {
    const res = await execSQL('UPDATE orders SET status = \'assigned\', player_id = $1 WHERE id = $2 AND status = \'pending\' RETURNING id', [currentUser.id, id]);
    if (res.length > 0) showToast('接单成功'); else showToast('订单已被抢走');
    await loadHall(); if (currentUser.role === 'player') await loadMine();
  } catch(e) { showToast('接单失败'); }
};

window.uploadImage = function(id) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      showToast('图片压缩中...');
      const base64 = await compressImage(file);
      if (!isDbReady) {
        const order = offlineOrders.find(o => o.id == id);
        if (order) { order.status = 'completed'; order.photo_url = base64; showToast('上传成功(离线)'); }
        return loadHall();
      }
      await execSQL('UPDATE orders SET status = \'completed\', photo_url = $1 WHERE id = $2', [base64, id]);
      showToast('上传成功，等待审核');
      await loadHall(); if (currentUser.role === 'player') await loadMine();
    } catch (err) { showToast(err.message || '上传失败'); }
  };
  input.click();
};

window.cancelOrder = async function(id, isMine) {
  if (!isDbReady) {
    const order = offlineOrders.find(o => o.id == id);
    if (order) {
      if (isMine === 'true') { order.status = 'pending'; order.player_id = null; } else { order.status = 'cancelled'; }
      showToast('已取消(离线)');
    }
    return loadHall();
  }
  try {
    if (isMine === 'true') {
      await execSQL('UPDATE orders SET status = \'pending\', player_id = null WHERE id = $1', [id]);
      showToast('已放弃接单');
    } else {
      await execSQL('UPDATE orders SET status = \'cancelled\' WHERE id = $1', [id]);
      showToast('订单已取消');
    }
    await loadHall();
  } catch(e) { showToast('取消失败'); }
};

window.handleDispatch = async function() {
  const req = $('disReq').value.trim(); const ac = parseFloat($('disAc').value); const ap = parseFloat($('disAp').value);
  if (!req || isNaN(ac) || isNaN(ap)) return showToast('请填写完整');
  if (!isDbReady) {
    offlineOrders.unshift({ id: Date.now(), customer_req: req, amount_client: ac, amount_player: ap, status: 'pending', player_id: null });
    showToast('派单成功(离线)'); $('disReq').value = ''; $('disAc').value = ''; $('disAp').value = ''; return loadHall();
  }
  try {
    await execSQL('INSERT INTO orders (customer_req, amount_client, amount_player, status) VALUES ($1, $2, $3, \'pending\')', [req, ac, ap]);
    showToast('派单成功'); $('disReq').value = ''; $('disAc').value = ''; $('disAp').value = ''; await loadHall();
  } catch(e) { showToast('派单失败'); }
};

window.handleAddUser = async function() {
  const u = $('newUser').value.trim(); const p = $('newPass').value; const r = $('newRole').value;
  if (!u || !p) return showToast('账号密码不能为空');
  if (!isDbReady) return showToast('离线模式无法添加账号');
  try {
    const hash = sha256(p);
    await execSQL('INSERT INTO users (username, password_hash, role) VALUES ($1, $2, $3)', [u, hash, r]);
    showToast('账号添加成功'); $('newUser').value = ''; $('newPass').value = '';
  } catch (e) { showToast('添加失败，账号可能已存在'); }
};

window.loadReviewOrders = async function() {
  const list = $('reviewList'); list.innerHTML = '<p style="text-align:center;color:#888;">加载中...</p>';
  if (!isDbReady) return renderReviewUI(offlineOrders.filter(o => o.status === 'completed'), list);
  try {
    const rows = await execSQL('SELECT id, customer_req, photo_url FROM orders WHERE status = \'completed\' ORDER BY id DESC');
    renderReviewUI(rows, list);
  } catch(e) { list.innerHTML = '<p style="text-align:center;color:#ff6b6b;">加载失败</p>'; }
};

function renderReviewUI(rows, list) {
  if (rows.length === 0) { list.innerHTML = '<p style="text-align:center;color:#888;font-size:0.85rem;">暂无待审核订单</p>'; return; }
  list.innerHTML = rows.map(o => `
    <div class="order-card">
      <div class="order-req">${escapeHtml(o.customer_req)}</div>
      ${o.photo_url ? `<img class="order-photo" src="${o.photo_url}">` : '<p style="font-size:0.8rem;color:#888;">无凭证图片</p>'}
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn btn-small btn-primary" onclick="approveOrder('${o.id}')" style="flex:1;">审核通过</button>
        <button class="btn btn-small btn-danger" onclick="rejectOrder('${o.id}')" style="flex:1;">审核不通过</button>
      </div>
    </div>`).join('');
}

window.approveOrder = async function(id) {
  if (!isDbReady) {
    const order = offlineOrders.find(o => o.id == id);
    if (order) { order.status = 'approved'; order.random_code = generateCode(); showToast('审核通过(离线)'); }
    loadReviewOrders(); loadHall(); return;
  }
  try {
    const code = generateCode();
    await execSQL('UPDATE orders SET status = \'approved\', random_code = $1 WHERE id = $2', [code, id]);
    showToast('审核通过'); await loadReviewOrders(); await loadHall();
  } catch(e) { showToast('审核失败'); }
};

window.rejectOrder = async function(id) {
  if (!isDbReady) {
    const order = offlineOrders.find(o => o.id == id);
    if (order) { order.status = 'assigned'; order.photo_url = null; showToast('已退回重做(离线)'); }
    loadReviewOrders(); loadHall(); return;
  }
  try {
    await execSQL('UPDATE orders SET status = \'assigned\', photo_url = null WHERE id = $1', [id]);
    showToast('已退回，打手需重新上传'); await loadReviewOrders(); await loadHall();
  } catch(e) { showToast('操作失败'); }
};

window.loadAllOrders = async function() {
  const list = $('allList'); list.innerHTML = '<p style="text-align:center;color:#888;">加载中...</p>';
  if (!isDbReady) {
    list.innerHTML = offlineOrders.map(o => `
      <div class="order-card"><div class="order-req">${escapeHtml(o.customer_req)}</div><div style="font-size:0.8rem; color:#aaa; margin-bottom:8px;">状态: ${o.status}</div>${o.random_code ? `<div class="code-badge">${o.random_code}</div>` : ''}</div>
    `).join('') || '<p style="text-align:center;color:#888;font-size:0.85rem;">暂无记录</p>';
    return;
  }
  try {
    const rows = await execSQL('SELECT o.id, o.customer_req, o.status, o.random_code, u.username AS player_name FROM orders o LEFT JOIN users u ON o.player_id = u.id ORDER BY o.id DESC');
    if (rows.length === 0) { list.innerHTML = '<p style="text-align:center;color:#888;font-size:0.85rem;">暂无记录</p>'; return; }
    list.innerHTML = rows.map(o => `
      <div class="order-card">
        <div class="order-req">${escapeHtml(o.customer_req)}</div>
        <div style="font-size:0.8rem; color:#aaa; margin-bottom:8px;">状态: ${o.status} | 打手: ${o.player_name || '无'}</div>
        ${o.random_code ? `<div class="code-badge">${o.random_code}</div>` : ''}
      </div>`).join('');
  } catch(e) { list.innerHTML = '<p style="text-align:center;color:#ff6b6b;">加载失败</p>'; }
};

async function loadMine() {
  const list = $('myList'); list.innerHTML = '<p style="text-align:center;color:#888;">加载中...</p>';
  if (!isDbReady) return renderMineUI(offlineOrders.filter(o => o.player_id === currentUser.id && ['assigned', 'completed', 'approved'].includes(o.status)), list);
  try {
    const rows = await execSQL('SELECT id, customer_req, status, random_code FROM orders WHERE player_id = $1 AND status IN (\'assigned\', \'completed\', \'approved\') ORDER BY id DESC', [currentUser.id]);
    renderMineUI(rows, list);
  } catch(e) { list.innerHTML = '<p style="text-align:center;color:#ff6b6b;">加载失败</p>'; }
}

function renderMineUI(rows, list) {
  if (rows.length === 0) { list.innerHTML = '<p style="text-align:center;color:#888;font-size:0.85rem;">暂无记录</p>'; return; }
  list.innerHTML = rows.map(o => `
    <div class="order-card">
      <div class="order-req">${escapeHtml(o.customer_req)}</div>
      <div class="status-text" style="margin-bottom:8px;">状态: ${o.status}</div>
      ${o.status === 'approved' && o.random_code ? `<div class="code-badge">${o.random_code}</div>` : ''}
    </div>`).join('');
}

window.handleChangePass = async function() {
  const p = $('changePassInput').value;
  if (!p || p.length < 3) return showToast('密码至少3位');
  if (!isDbReady) return showToast('离线模式无法修改密码');
  try {
    const hash = sha256(p);
    await execSQL('UPDATE users SET password_hash = $1 WHERE id = $2', [hash, currentUser.id]);
    showToast('密码修改成功'); $('changePassInput').value = '';
  } catch(e) { showToast('修改密码失败'); }
};

window.handleLogin = async function() {
  const u = $('loginUser').value.trim();
  const p = $('loginPass').value;
  const hint = $('loginHint');
  if (!u || !p) { hint.textContent = '请输入账号和密码'; return; }

  // 超管极速通道，无需等待网络
  if (u === 'admin' && p === 'admin') {
    hint.textContent = '';
    showToast('超管登录成功');
    currentUser = { id: -1, username: 'admin', role: 'superadmin' };
    renderUI();
    initDB();
    return;
  }

  hint.textContent = '正在连接数据库中...';
  const dbOk = await initDB();
  if (!dbOk) {
    hint.textContent = '网络异常，只能使用 admin 离线登录';
    return;
  }

  try {
    const hash = sha256(p);
    const rows = await execSQL('SELECT id, username, role FROM users WHERE username = $1 AND password_hash = $2 LIMIT 1', [u, hash]);
    if (rows.length === 0) throw new Error('账号或密码错误');
    currentUser = rows[0];
    showToast('登录成功'); hint.textContent = ''; renderUI();
  } catch (e) {
    hint.textContent = e.message || '登录失败';
  }
};

window.handleLogout = function() {
  currentUser = null;
  $('mainPage').classList.remove('active');
  $('loginPage').classList.add('active');
  $('roleContent').innerHTML = '';
  $('loginUser').value = ''; $('loginPass').value = ''; $('loginHint').textContent = '';
  showToast('已退出');
};

window.addEventListener('DOMContentLoaded', () => { initDB(); });
</script>
</body>
</html>
