name: Deploy static
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
      - name: Deploy
        uses: actions/deploy-pages@v4